name: Daily Career Alert & Job Match Refresh

on:
  schedule:
    # Runs daily at 03:30 UTC = 09:00 AM IST (Indian Standard Time)
    - cron: '30 3 * * *'
  workflow_dispatch:
    # Allows 1-click manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  refresh-and-notify:
    runs-on: ubuntu-latest
    name: Crawl Active Openings & Dispatch Email Alert

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Job Crawler & Email Dispatcher
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_SERVER: ${{ secrets.EMAIL_SERVER || 'smtp.gmail.com' }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT || '587' }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT || 'ajadhav311989@gmail.com' }}
        run: |
          python scripts/daily_job_crawler.py

      - name: Upload Daily Email Digest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-career-digest
          path: data/latest_email_alert.html
          retention-days: 7

      - name: Commit & Push Daily Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "No dataset changes to commit today."
          else
            git commit -m "Automated daily talent update & job refresh [skip ci]"
            git push
          fi
