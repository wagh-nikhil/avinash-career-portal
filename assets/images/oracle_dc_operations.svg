<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="oracle-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Bezel -->
  <circle cx="100" cy="95" r="85" fill="url(#silver-grad)" stroke="#64748b" stroke-width="4" filter="url(#badge-shadow)"/>
  <circle cx="100" cy="95" r="75" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Inner Content -->
  <text x="100" y="55" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#f97316" text-anchor="middle" letter-spacing="1">ORACLE</text>
  <text x="100" y="70" font-family="Arial, sans-serif" font-weight="600" font-size="10" fill="#94a3b8" text-anchor="middle">Certified</text>
  
  <text x="100" y="94" font-family="Arial, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle">Foundations</text>
  <text x="100" y="110" font-family="Arial, sans-serif" font-weight="800" font-size="13" fill="#ffffff" text-anchor="middle">Associate</text>
  
  <line x1="40" y1="120" x2="160" y2="120" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="100" y="136" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#38bdf8" text-anchor="middle">DATA CENTER</text>
  <text x="100" y="148" font-family="Arial, sans-serif" font-weight="700" font-size="9" fill="#94a3b8" text-anchor="middle">OPERATIONS 2026</text>
  
  <!-- Stand / Base -->
  <path d="M 60 175 L 85 155 L 115 155 L 140 175 Z" fill="#b45309" stroke="#78350f" stroke-width="2"/>
</svg>
